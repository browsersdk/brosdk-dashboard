[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/ai-agent",
  "crates/domain",
  "crates/local-api",
  "crates/manager",
  "crates/mcp-client",
  "crates/platform",
  "crates/runtime-ipc",
  "crates/sdk-client",
  "crates/sdk-ffi",
  "crates/sdk-host",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
libloading = "0.8"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.5", default-features = false, features = ["wry"] }
tauri-build = { version = "2.2", features = [] }
thiserror = "2.0"
tokio = { version = "1.46", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.17", features = ["serde", "v4"] }
url = "2.5"
walkdir = "2.5"
zip = { version = "4.3", default-features = false, features = ["deflate"] }
